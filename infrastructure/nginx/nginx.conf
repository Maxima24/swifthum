# Edge nginx main config for SwiftHum.
# Drops the official image's default — adds a log format that surfaces the real
# client IP (Cloudflare sends it via CF-Connecting-IP, picked up via real_ip_*
# rules in snippets/cloudflare-real-ip.conf included from the server blocks).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format swifthum '$http_cf_connecting_ip - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'host=$host upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log swifthum;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # 1 MiB request bodies are plenty for JSON APIs + chat-token redemption.
    client_max_body_size 1m;

    # The nginx image's docker-entrypoint renders /etc/nginx/templates/*.template
    # → /etc/nginx/conf.d/*.conf on boot, substituting ${DOMAIN} from the env.
    include /etc/nginx/conf.d/*.conf;
}
