# Single-purpose nginx for the SwiftHum Mini App static bundle.
# SPA fallback to /index.html; hashed assets cached forever; index.html never cached.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset files (Vite outputs /assets/<name>-<hash>.{js,css}) — immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html: never cache, so users always get the latest app shell.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA routing: any unknown path falls back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_proxied any;

    # Health probe target for the edge / compose healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
